<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classroom Timeline</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- External Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="timeline.css">
</head>
<body>
<div class="page-wrapper">
    
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-box">
        <h2 style="color: var(--primary-color); margin-top: 0;">Timeline Access</h2>
        <div style="background: var(--comment-bg); padding: 14px; border-radius: 8px; font-size: 14px; color: var(--text-muted); margin-bottom: 16px; text-align: left; border: 1px solid var(--border-color);">
            <strong>Students:</strong> Enter your 5-Character code as BOTH Username and Password.<br><br>
            <strong>Teachers/Admin:</strong> Login with registered Email and Password.
        </div>
        <input type="text" id="loginUsername" placeholder="Username / Code / Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">Secure Login</button>
        <a href="index.html" style="display: block; margin-top: 16px; font-size: 14px; color: var(--text-muted); text-decoration: none;">&larr; Back to Portal</a>
    </div>

    <!-- MAIN TIMELINE APP -->
    <div id="timelineApp" class="container timeline-container hidden">
        
        <div class="top-nav">
            <a href="index.html" style="color: var(--primary-color); text-decoration: none; font-size: 15px; font-weight: 600;">&larr; Back to Portal</a>
            <div class="nav-controls">
                
                <button id="darkModeToggle" class="theme-toggle-btn">Dark</button>

                <div class="notif-wrapper">
                    <button id="notifToggleBtn" class="notif-btn">Alerts <span id="notifBadge" class="notif-badge">0</span></button>
                    <div id="notifDropdown" class="notif-dropdown">
                        <div style="padding: 12px; text-align: center; font-size: 13px; color: var(--text-muted);">Loading notifications...</div>
                    </div>
                </div>

                <button id="logoutBtn" style="background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; min-height: 40px;">Logout</button>
            </div>
        </div>
        
        <div style="text-align: center; margin-bottom: 12px;">
            <h2 style="color: var(--primary-color); margin: 0 0 6px 0; font-size: 24px;">Classroom Discussion</h2>
            <p style="font-size: 14px; color: #10b981; margin: 0; font-weight: 600;">
                Logged in as: <span id="currentUserDisplay"></span>
            </p>
        </div>
        
        <!-- POST CREATION BOX -->
        <div class="post-box">
            <textarea id="postMessage" placeholder="What would you like to share with the class? (Type @ to mention someone)"></textarea>
            
            <div class="post-options-row">
                <div class="target-selector-wrapper">
                    <label for="postTargetClass">Audience:</label>
                    <select id="postTargetClass">
                        <option value="All">All Classes</option>
                        <!-- Classes will be dynamically populated via JavaScript -->
                    </select>
                </div>
                <button id="submitPostBtn">Post to Timeline</button>
            </div>
        </div>

        <div id="timelineFeed">
            <!-- Posts injected dynamically via JS -->
        </div>
    </div>
</div>

<div id="mentionPopup" class="mention-popup hidden"></div>

<script type="module" src="timeline.js"></script>
</body>
</html>

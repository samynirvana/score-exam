<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MITRA KASIH SCHOOL - Student Portal Login</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1o_7O1hdx1SJOXfoFw9ZKxpl4zSOD_VYd">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=379">
    <link rel="stylesheet" href="admin.css?v=388">
    <link rel="stylesheet" href="student.css?v=391">
</head>

<body>

    <div id="studentLoginOverlay" class="student-login-fullscreen-overlay">
        <div class="student-split-login-card">
            
            <!-- LEFT COLUMN: DYNAMIC DAY/NIGHT CAMPUS IMAGE & BRANDING -->
            <div class="login-card-visual-col">
                <img id="loginVisualCampusImg" class="login-visual-img" src="day_building.jpg" alt="Mitra Kasih Campus">
                <div class="login-visual-overlay"></div>

                <div class="login-visual-content">
                    <h3 class="login-visual-school-name">Mitra Kasih Middle and High School</h3>
                    <div class="login-visual-quote-box">
                        <p id="loginDailyQuoteText" class="login-visual-school-tagline">"The expert in anything was once a beginner."</p>
                        <span id="loginDailyQuoteAuthor" class="login-visual-quote-author">— Helen Hayes</span>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: LOGIN CREDENTIALS FORM -->
            <div class="login-card-form-col">
                <div class="login-form-brand-row">
                    <img src="mks_logo.png" 
                         onerror="this.onerror=null; this.src='https://lh3.googleusercontent.com/d/1ge2ndYnSE0CLQl_iqqRhcLGlxD0A-Bum';" 
                         alt="Sekolah Mitra Kasih" 
                         class="login-form-brand-logo">
                </div>

                <div class="login-form-group">
                    <label for="loginStudentUsername">Username</label>
                    <input type="text" id="loginStudentUsername" placeholder="Enter username or student code" autocomplete="username">
                </div>

                <div class="login-form-group">
                    <label for="loginStudentPassword">Password</label>
                    <input type="password" id="loginStudentPassword" placeholder="Code or Account Password" autocomplete="current-password">
                </div>

                <label for="loginRememberMe" style="display: flex; align-items: center; gap: 9px; margin: -2px 0 24px 0; text-align: left; font-size: 13.5px; font-weight: 500; font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; color: var(--text-dark, #334155); cursor: pointer; user-select: none;">
                    <input type="checkbox" id="loginRememberMe" style="width: 17px; height: 17px; min-height: 0; margin: 0; padding: 0; accent-color: #1e5eff; flex-shrink: 0; border-radius: 4px; cursor: pointer;">
                    <span>Remember my login</span>
                </label>

                <button id="studentLoginBtn" class="login-form-btn-submit" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    <span>Log In to Portal</span>
                </button>

                <!-- ERROR MESSAGE -->
                <div id="loginErrorMessage" class="error-box hidden" style="margin-top: 14px;">
                    Invalid credentials. Please check your username and password.
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="login.js?v=451"></script>
    <script type="module" src="studentNav.js?v=451"></script>
</body>

</html>

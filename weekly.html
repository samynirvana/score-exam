<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Weekly Schedule</title>
  <style>
    :root {
      --border-color: #cbd5e1;
      --header-bg: #f1f5f9;
      --break-bg: #e2e8f0;
      --accent: #2563eb;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background-color: #f8fafc;
      color: #0f172a;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 1px solid var(--border-color);
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Layout Containers */
    .teacher-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .schedule-side { flex: 65%; overflow-x: auto; }
    .material-side { flex: 35%; }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: white;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: center;
      vertical-align: middle;
    }

    th { background-color: var(--header-bg); font-weight: bold; }
    .break-row { background-color: var(--break-bg); font-weight: bold; }

    /* Content Cards in Cells */
    .subject-title { font-weight: bold; display: block; margin-bottom: 2px; }
    .material-text { font-size: 11px; color: #334155; margin-bottom: 4px; }
    
    .resource-link {
      display: inline-block;
      font-size: 10px;
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
      background: #eff6ff;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #bfdbfe;
    }
    .resource-link:hover { text-decoration: underline; background: #dbeafe; }

    /* Inputs */
    input[type="text"] {
      width: 90%;
      padding: 5px;
      font-size: 11px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .save-btn {
      margin-top: 12px;
      padding: 10px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('classView')">Class View (Student)</button>
    <button class="tab-btn" onclick="switchTab('teacherView')">Teacher Material Entry</button>
  </div>

  <!-- 1. CLASS VIEW (STUDENTS) -->
  <div id="classView" class="tab-content active">
    <h2>Class Schedule: Grade 9C</h2>
    <table>
      <thead>
        <tr>
          <th style="width: 12%;">TIME</th>
          <th>MONDAY</th>
          <th>TUESDAY</th>
          <th>WEDNESDAY</th>
          <th>THURSDAY</th>
          <th>FRIDAY</th>
        </tr>
      </thead>
      <tbody id="classScheduleBody">
        <!-- Rendered via JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- 2. TEACHER VIEW -->
  <div id="teacherView" class="tab-content">
    <h2>Teacher Panel: Mr. Syam</h2>
    <div class="teacher-layout">
      
      <!-- Left Schedule Grid -->
      <div class="schedule-side">
        <table>
          <thead>
            <tr>
              <th>TIME</th>
              <th>MON</th>
              <th>TUE</th>
              <th>WED</th>
              <th>THU</th>
              <th>FRI</th>
            </tr>
          </thead>
          <tbody id="teacherScheduleBody">
            <!-- Rendered via JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- Right Material Entry Table -->
      <div class="material-side">
        <table>
          <thead>
            <tr>
              <th colspan="4">PERSONAL MATERIALS</th>
            </tr>
            <tr>
              <th>Class</th>
              <th>Material</th>
              <th>Combine</th>
              <th>LINK</th>
            </tr>
          </thead>
          <tbody id="materialTableBody">
            <!-- Rendered via JavaScript -->
          </tbody>
        </table>
        <button class="save-btn" id="saveMaterialsBtn">Save All Materials to Firebase</button>
      </div>

    </div>
  </div>

  <!-- Firebase JavaScript SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Insert your Firebase project credentials here
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "weekly-teacher.firebaseapp.com",
      projectId: "weekly-teacher",
      storageBucket: "weekly-teacher.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Timetable slot assignments (Managed by Admin)
    const timetableStructure = [
      { time: "07.30 - 07.40", type: "break", label: "OPENING" },
      { time: "07.40 - 08.25", MONDAY: "English G9A", WEDNESDAY: "ICT G9A", THURSDAY: "ICT G9B" },
      { time: "08.25 - 09.10", MONDAY: "English G9A", WEDNESDAY: "ICT G9A", THURSDAY: "ICT G9B" },
      { time: "09.10 - 09.55", MONDAY: "ICT G9C", THURSDAY: "English G9C" },
      { time: "09.55 - 10.10", type: "break", label: "BREAK" },
      { time: "10.10 - 10.55", MONDAY: "ICT G9C", TUESDAY: "ICT G10A", WEDNESDAY: "ICT G10B", THURSDAY: "English G9C", FRIDAY: "English G9B" },
      { time: "10.55 - 11.40", TUESDAY: "ICT G10A", WEDNESDAY: "ICT G10B", THURSDAY: "English G9A", FRIDAY: "English G9B" }
    ];

    const teacherClasses = ["English G9A", "English G9B", "English G9C", "ICT G9A", "ICT G9B", "ICT G9C", "ICT G10A", "ICT G10B"];
    let materialsData = {};

    // Tab Switching Logic
    window.switchTab = (tabId) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    };

    // Render Student Class View (Includes Clickable Links)
    function renderClassSchedule() {
      const tbody = document.getElementById('classScheduleBody');
      tbody.innerHTML = '';
      const days = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"];

      timetableStructure.forEach(row => {
        const tr = document.createElement('tr');
        if (row.type === 'break') {
          tr.className = 'break-row';
          tr.innerHTML = `<td>${row.time}</td><td colspan="5">${row.label}</td>`;
        } else {
          let html = `<td><strong>${row.time}</strong></td>`;
          days.forEach(day => {
            const className = row[day];
            if (className) {
              const matInfo = materialsData[className] || {};
              const linkHtml = matInfo.link ? `<a href="${matInfo.link}" target="_blank" class="resource-link">🔗 Resource Link</a>` : '';
              html += `
                <td>
                  <span class="subject-title">${className}</span>
                  <div class="material-text">${matInfo.material || 'No material added'}</div>
                  ${linkHtml}
                </td>`;
            } else {
              html += `<td>-</td>`;
            }
          });
          tr.innerHTML = html;
        }
        tbody.appendChild(tr);
      });
    }

    // Render Teacher Material Table
    function renderMaterialTable() {
      const tbody = document.getElementById('materialTableBody');
      tbody.innerHTML = '';

      teacherClasses.forEach(cls => {
        const mat = materialsData[cls]?.material || '';
        const link = materialsData[cls]?.link || '';
        const combine = mat ? `${cls}\n${mat}` : cls;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${cls}</strong></td>
          <td><input type="text" class="mat-input" data-class="${cls}" value="${mat}" placeholder="Enter topic..."></td>
          <td style="white-space: pre-line;">${combine}</td>
          <td><input type="text" class="link-input" data-class="${cls}" value="${link}" placeholder="https://..."></td>
        `;
        tbody.appendChild(tr);
      });

      // Attach instant input handlers
      document.querySelectorAll('.mat-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const cls = e.target.dataset.class;
          if (!materialsData[cls]) materialsData[cls] = {};
          materialsData[cls].material = e.target.value;
          renderClassSchedule();
          renderTeacherScheduleGrid();
        });
      });

      document.querySelectorAll('.link-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const cls = e.target.dataset.class;
          if (!materialsData[cls]) materialsData[cls] = {};
          materialsData[cls].link = e.target.value;
          renderClassSchedule();
        });
      });
    }

    // Render Left Schedule Grid in Teacher View
    function renderTeacherScheduleGrid() {
      const tbody = document.getElementById('teacherScheduleBody');
      tbody.innerHTML = '';
      const days = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"];

      timetableStructure.forEach(row => {
        const tr = document.createElement('tr');
        if (row.type === 'break') {
          tr.className = 'break-row';
          tr.innerHTML = `<td>${row.time}</td><td colspan="5">${row.label}</td>`;
        } else {
          let html = `<td><strong>${row.time}</strong></td>`;
          days.forEach(day => {
            const cls = row[day];
            if (cls) {
              const mat = materialsData[cls]?.material || '';
              html += `<td><strong>${cls}</strong><br><small>${mat}</small></td>`;
            } else {
              html += `<td></td>`;
            }
          });
          tr.innerHTML = html;
        }
        tbody.appendChild(tr);
      });
    }

    // Save Data to Firebase
    document.getElementById('saveMaterialsBtn').addEventListener('click', async () => {
      try {
        await setDoc(doc(db, "schedules", "Grade9C_Materials"), materialsData, { merge: true });
        alert("Materials and Links successfully saved to Firebase!");
      } catch (err) {
        alert("Error saving: " + err.message);
      }
    });

    // Sync in Real-Time from Firebase
    onSnapshot(doc(db, "schedules", "Grade9C_Materials"), (docSnap) => {
      if (docSnap.exists()) {
        materialsData = docSnap.data();
        renderClassSchedule();
        renderMaterialTable();
        renderTeacherScheduleGrid();
      }
    });
  </script>
</body>
</html>
